<!DOCTYPE html>
<html lang="en">
<head>

<script>
    let usersJSON = localStorage.getItem('users');
    console.log(usersJSON);

    let users = JSON.parse(usersJSON);
    console.log(users);

    users.push({});
    console.log(users);

    localStorage.setItem('users', JSON.stringify(users));
</script>
